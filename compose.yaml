services:
  game:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5174"
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://127.0.0.1:5174}"
    volumes:
      - game-data:/app/data

volumes:
  game-data:
